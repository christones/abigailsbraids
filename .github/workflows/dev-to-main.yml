name: Auto PR dev to main

on:
  workflow_run:
    workflows: ["CI"]
    branches: [dev]
    types: [completed]

permissions:
  contents: write
  pull-requests: write

jobs:
  open-and-merge:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: dev

      - name: Create pull request if none exists
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if ! gh pr list --base main --head dev --state open --json number --jq '.[0].number' | grep -q .; then
            gh pr create --base main --head dev \
              --title "Merge dev into main" \
              --body "Mise à jour automatique depuis \`dev\` après passage de la CI."
          fi

      - name: Enable auto-merge
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PR_NUMBER=$(gh pr list --base main --head dev --state open --json number --jq '.[0].number')
          gh pr merge "$PR_NUMBER" --auto --squash
